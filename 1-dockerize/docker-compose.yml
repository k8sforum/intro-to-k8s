# Build and push in one step:
#   docker compose -f docker-compose.yml up --build
services:
#Storage - https://github.com/minio/minio
  minio:
    image: quay.io/minio/minio
    container_name: minio
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"   # S3 API
      - "9090:9090"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
#Messaging - https://hub.docker.com/_/rabbitmq
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mytravels-rabbitmq
    ports:
      - "5672:5672"      # for messaging
      - "15672:15672"    # for the management UI
      - "15692:15692"    # for Prometheus metrics (rabbitmq_prometheus plugin)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - mqdata:/var/lib/rabbitmq
      - mqconfig:/etc/rabbitmq
      - ./observability/rabbitmq-enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 10s
      retries: 5
#Search - https://hub.docker.com/_/solr
  # solr-precreate creates the collection on first boot from the default configset;
  # the field definitions the app queries are applied at runtime by the
  # SolrSchemaInitializer hosted service in messaging.
  solr:
    image: solr:9.10.1
    container_name: mytravels-solr
    ports:
      - "8983:8983"    # HTTP API and Admin UI
    command: ["solr-precreate", "mytravels-pois"]
    volumes:
      - solr-data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8983/solr/mytravels-pois/admin/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
#DBs
  # https://github.com/felipewom/docker-compose-postgres
  postgres:
    image: postgres:17.6-alpine
    container_name: mytravels-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -h localhost -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5      
# DB Script Runner - runs after Postgres is healthy to execute custom SQL commands
  cleanup-migrations:
    image: postgres:17.6-alpine
    container_name: cleanup-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: |
      PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" <<'EOSQL'
      DO $$
      BEGIN
        IF EXISTS (
          SELECT 1 FROM information_schema.tables 
          WHERE table_schema='config' AND table_name='EFMigrationsHistory'
        ) THEN
          DELETE FROM "EFMigrationsHistory" WHERE "MigrationId" IN ('20600930075821_SeedData', '20590930075747_UpdateStoredProcedure');
        END IF;
      END
      $$;
      EOSQL
#Feature flags - https://docs.flagsmith.com. Shares mytravels-postgres in a second
# database (FeatureDb), not a second container - see CLAUDE.md "Feature flagging".
  flagsmith-create-db:
    image: postgres:17.6-alpine
    container_name: flagsmith-create-db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: "no"
    # NOTE: command is given as a YAML list (not a plain multi-line string) on
    # purpose - Compose shell-word-splits a string `command`, which silently
    # breaks any command containing a pipe, `||`, or heredoc (only the first
    # word ever reaches `sh -c`). Wrapping it as [sh, -c, "<script>"] keeps the
    # whole script as one argv element. See cleanup-migrations above, which has
    # this exact latent bug - its DELETE statement has never actually executed.
    command:
      - sh
      - -c
      - |
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tc "SELECT 1 FROM pg_database WHERE datname = 'FeatureDb'" | grep -q 1 || \
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c 'CREATE DATABASE "FeatureDb"'

  flagsmith-migrate:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.261.0
    container_name: flagsmith-migrate
    command: migrate
    restart: "no"
    environment: &flagsmith-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/FeatureDb
      DJANGO_SECRET_KEY: ${FLAGSMITH_DJANGO_SECRET_KEY}
      ENVIRONMENT: production
      DJANGO_ALLOWED_HOSTS: "*"
      ALLOW_ADMIN_INITIATION_VIA_CLI: "true"
      ADMIN_EMAIL: ${FLAGSMITH_ADMIN_EMAIL}
      FLAGSMITH_ADMIN_PASSWORD: ${FLAGSMITH_ADMIN_PASSWORD}
      ORGANISATION_NAME: mytravels
      PROJECT_NAME: mytravels
    depends_on:
      flagsmith-create-db:
        condition: service_completed_successfully

  # Creates the superuser + organisation + project (idempotent - a no-op on
  # rerun). Logs a password-reset link rather than a usable password; the
  # separate flagsmith-seed step below sets a real password directly via the
  # ORM instead of parsing that link, since the link is only needed for the
  # HTTP reset-password flow, which the ORM path skips entirely.
  flagsmith-bootstrap:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.261.0
    container_name: flagsmith-bootstrap
    command: bootstrap
    restart: "no"
    environment: *flagsmith-env
    depends_on:
      flagsmith-migrate:
        condition: service_completed_successfully

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.261.0
    container_name: mytravels-flagsmith
    command: serve
    ports:
      - "8000:8000"   # REST API + admin console UI (same image serves both)
    environment: *flagsmith-env
    depends_on:
      flagsmith-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      # The image is Wolfi-based with no curl/wget; `flagsmith healthcheck http`
      # is the image's own built-in check and defaults to GET /health/liveness.
      test: ["CMD", "flagsmith", "healthcheck", "http"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.261.0
    container_name: flagsmith-task-processor
    command: run-task-processor
    environment: *flagsmith-env
    depends_on:
      flagsmith-migrate:
        condition: service_completed_successfully

  # Idempotent: creates the "Production" environment and the three flags (all
  # defaulting to enabled) directly via Flagsmith's own Django ORM - no HTTP
  # calls, no password/login dance. Also sets a real admin password (from
  # FLAGSMITH_ADMIN_PASSWORD) so a human can still log into the console.
  # Rewrites FLAGSMITH_SERVER_SIDE_ENVIRONMENT_KEY and VITE_FLAGSMITH_ENVIRONMENT_ID
  # into .env in place - see the two-phase bring-up note in runbook.ipynb: the
  # rest of the stack must be started in a second `docker compose up` invocation
  # after this rewrite, since Compose interpolates ${...} from .env once, at
  # parse time, before this container has run.
  flagsmith-seed:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.261.0
    container_name: flagsmith-seed
    user: root  # sed needs to write into the bind-mounted .env file below
    restart: "no"
    environment: *flagsmith-env
    volumes:
      - ./.env:/workspace/.env
    depends_on:
      flagsmith-bootstrap:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        OUTPUT=$$(flagsmith shell -c "
        import os
        from organisations.models import Organisation
        from projects.models import Project
        from environments.models import Environment, EnvironmentAPIKey
        from features.models import Feature
        from django.contrib.auth import get_user_model

        org = Organisation.objects.get(name=os.environ['ORGANISATION_NAME'])
        project = Project.objects.get(organisation=org, name=os.environ['PROJECT_NAME'])

        user = get_user_model().objects.get(email=os.environ['ADMIN_EMAIL'])
        user.set_password(os.environ['FLAGSMITH_ADMIN_PASSWORD'])
        user.save()

        env, _ = Environment.objects.get_or_create(project=project, name='Production')

        server_key = EnvironmentAPIKey.objects.filter(environment=env, name='mytravels-seed').first()
        if server_key is None:
            server_key = EnvironmentAPIKey.objects.create(environment=env, name='mytravels-seed')

        for name in ['enable-image-description', 'enable-poi-search', 'enable-message-tracing']:
            Feature.objects.get_or_create(project=project, name=name, defaults={'default_enabled': True})

        print(f'FLAGSMITH_SERVER_SIDE_ENVIRONMENT_KEY={server_key.key}')
        print(f'VITE_FLAGSMITH_ENVIRONMENT_ID={env.api_key}')
        ")
        SERVER_KEY_LINE=$$(echo "$$OUTPUT" | grep '^FLAGSMITH_SERVER_SIDE_ENVIRONMENT_KEY=')
        CLIENT_KEY_LINE=$$(echo "$$OUTPUT" | grep '^VITE_FLAGSMITH_ENVIRONMENT_ID=')
        # Rewrite via a temp file + cat, not sed -i: sed -i renames over the
        # target, and Docker bind-mounts of a single file reject renaming onto
        # the mountpoint ("Device or resource busy").
        sed -e "s|^FLAGSMITH_SERVER_SIDE_ENVIRONMENT_KEY=.*|$$SERVER_KEY_LINE|" \
            -e "s|^VITE_FLAGSMITH_ENVIRONMENT_ID=.*|$$CLIENT_KEY_LINE|" \
            /workspace/.env > /tmp/.env.rewritten
        cat /tmp/.env.rewritten > /workspace/.env
        echo "flagsmith-seed: wrote keys into .env"
# Migrations
  migrate-core-db:
    image: mytravels-migrations:v1.0.8
    build:
      context: ../src
      dockerfile: common/mytravels.migration/Dockerfile
    command: ["--connection", "${CORE_DB_CONTEXT}"]
    restart: "no"
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
    depends_on:
      postgres:
        condition: service_healthy    
  # ASP.NET CORE API
  api:
    container_name: mytravels-api
    image: mytravels-api:v1.0.13
    build:
      context: ../src
      dockerfile: api/mytravels.api/Dockerfile
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
      GoogleApiKey: ${GOOGLE_API_KEY}
      GoogleMapsUrl: ${GOOGLE_MAPS_URL}
      GooglePlacesUrl: ${GOOGLE_PLACES_URL}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      RabbitMQ__Uri: ${RABBIT_MQ_URI}
      MinIO__Endpoint: ${MINIO_ENDPOINT}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mytravels-api
      Solr__Url: ${SOLR_URL}
      Solr__Collection: ${SOLR_COLLECTION}
      Flagsmith__ApiUri: http://flagsmith:8000/api/v1/
      Flagsmith__ServerSideEnvironmentKey: ${FLAGSMITH_SERVER_SIDE_ENVIRONMENT_KEY}
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
    ports:
      - 5101:5101
    depends_on:
      rabbitmq:
        condition: service_healthy
      solr:
        condition: service_healthy
      migrate-core-db:
        condition: service_completed_successfully
      flagsmith:
        condition: service_healthy
  # MESSAGING APP
  messaging:
    container_name: mytravels-messaging
    image: mytravels-messaging:v1.0.16
    build:
      context: ../src
      dockerfile: messaging/mytravels.messaging/Dockerfile
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:5102
      RabbitMQ__Uri: ${RABBIT_MQ_URI}
      AnthropicApiKey: ${ANTHROPIC_API_KEY}
      AnthropicModel: ${ANTHROPIC_MODEL}
      MinIO__Endpoint: ${MINIO_ENDPOINT}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      GoogleApiKey: ${GOOGLE_API_KEY}
      GoogleMapsUrl: ${GOOGLE_MAPS_URL}
      GooglePlacesUrl: ${GOOGLE_PLACES_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mytravels-messaging
      Solr__Url: ${SOLR_URL}
      Solr__Collection: ${SOLR_COLLECTION}
      Flagsmith__ApiUri: http://flagsmith:8000/api/v1/
      Flagsmith__ServerSideEnvironmentKey: ${FLAGSMITH_SERVER_SIDE_ENVIRONMENT_KEY}
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
    ports:
      - 5102:5102
    depends_on:
      rabbitmq:
        condition: service_healthy
      solr:
        condition: service_healthy
      migrate-core-db:
        condition: service_completed_successfully
      flagsmith:
        condition: service_healthy
  # MCP SERVER
  mcp:
    container_name: mytravels-mcp
    image: mytravels-mcp:v1.0.2
    build:
      context: ../src
      dockerfile: api/mytravels.mcp/Dockerfile
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
      GoogleApiKey: ${GOOGLE_API_KEY}
      GoogleMapsUrl: ${GOOGLE_MAPS_URL}
      GooglePlacesUrl: ${GOOGLE_PLACES_URL}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:5103
      RabbitMQ__Uri: ${RABBIT_MQ_URI}
      MinIO__Endpoint: ${MINIO_ENDPOINT}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mytravels-mcp
      Solr__Url: ${SOLR_URL}
      Solr__Collection: ${SOLR_COLLECTION}
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
    ports:
      - 5103:5103
    depends_on:
      rabbitmq:
        condition: service_healthy
      solr:
        condition: service_healthy
      migrate-core-db:
        condition: service_completed_successfully
  # WEB UI
  web:
    container_name: mytravels-web
    image: mytravels-web:v1.0.9
    build:
      context: ../src
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
        VITE_FLAGSMITH_ENVIRONMENT_ID: ${VITE_FLAGSMITH_ENVIRONMENT_ID}
        VITE_FLAGSMITH_API_URL: ${VITE_FLAGSMITH_API_URL}
    ports:
      - 5100:80
    depends_on:
      - api
      - messaging
# Observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: mytravels-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (api/messaging)
      - "4318:4318"   # OTLP HTTP (browser RUM)
      - "8889:8889"   # Prometheus scrape target
    # No healthcheck: the contrib image is distroless (no wget/curl) so an
    # exec-based probe can't run. Services depend on it by start order only.

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mytravels-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"   # host 9091 - 9090 is already taken by the minio console
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.6.1
    container_name: mytravels-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API (Grafana explore / manual trace search)

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: mytravels-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: mytravels-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mytravels-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  pgdata:
    driver: local
  mqdata:
    driver: local
  mqconfig:
    driver: local
  minio-data:
    driver: local
  minio-config:
    driver: local
  prometheus-data:
    driver: local
  tempo-data:
    driver: local
  grafana-data:
    driver: local
  solr-data:
    driver: local