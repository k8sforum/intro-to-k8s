# Build and push in one step:
#   docker compose -f docker-compose.yml up --build
services:
#Storage - https://github.com/minio/minio
  minio:
    image: quay.io/minio/minio
    container_name: minio
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"   # S3 API
      - "9090:9090"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
#Messaging - https://hub.docker.com/_/rabbitmq
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mytravels-rabbitmq
    ports:
      - "5672:5672"      # for messaging
      - "15672:15672"    # for the management UI
      - "15692:15692"    # for Prometheus metrics (rabbitmq_prometheus plugin)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - mqdata:/var/lib/rabbitmq
      - mqconfig:/etc/rabbitmq
      - ./observability/rabbitmq-enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 10s
      retries: 5
#DBs
  # https://github.com/felipewom/docker-compose-postgres
  postgres:
    image: postgres:17.6-alpine
    container_name: mytravels-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -h localhost -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5      
# DB Script Runner - runs after Postgres is healthy to execute custom SQL commands
  cleanup-migrations:
    image: postgres:17.6-alpine
    container_name: cleanup-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: |
      PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" <<'EOSQL'
      DO $$
      BEGIN
        IF EXISTS (
          SELECT 1 FROM information_schema.tables 
          WHERE table_schema='config' AND table_name='EFMigrationsHistory'
        ) THEN
          DELETE FROM "EFMigrationsHistory" WHERE "MigrationId" IN ('20600930075821_SeedData', '20590930075747_UpdateStoredProcedure');
        END IF;
      END
      $$;
      EOSQL   
# Migrations
  migrate-core-db:
    image: mytravels-migrations:v1.0.5
    build:
      context: ../src
      dockerfile: common/mytravels.migration/Dockerfile
    command: ["--connection", "${CORE_DB_CONTEXT}"]
    restart: "no"
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
    depends_on:
      postgres:
        condition: service_healthy    
  # ASP.NET CORE API
  api:
    container_name: mytravels-api
    image: mytravels-api:v1.0.8
    build:
      context: ../src
      dockerfile: api/mytravels.api/Dockerfile
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
      GoogleApiKey: ${GOOGLE_API_KEY}
      GoogleMapsUrl: ${GOOGLE_MAPS_URL}
      GooglePlacesUrl: ${GOOGLE_PLACES_URL}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      RabbitMQ__Uri: ${RABBIT_MQ_URI}
      MinIO__Endpoint: ${MINIO_ENDPOINT}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mytravels-api
    ports:
      - 5101:5101
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate-core-db:
        condition: service_completed_successfully
  # MESSAGING APP
  messaging:
    container_name: mytravels-messaging
    image: mytravels-messaging:v1.0.10
    build:
      context: ../src
      dockerfile: messaging/mytravels.messaging/Dockerfile
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:5102
      RabbitMQ__Uri: ${RABBIT_MQ_URI}
      MinIO__Endpoint: ${MINIO_ENDPOINT}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      GoogleApiKey: ${GOOGLE_API_KEY}
      GoogleMapsUrl: ${GOOGLE_MAPS_URL}
      GooglePlacesUrl: ${GOOGLE_PLACES_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mytravels-messaging
    ports:
      - 5102:5102
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate-core-db:
        condition: service_completed_successfully
  # MCP SERVER
  mcp:
    container_name: mytravels-mcp
    image: mytravels-mcp:v1.0.0
    build:
      context: ../src
      dockerfile: api/mytravels.mcp/Dockerfile
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
      GoogleApiKey: ${GOOGLE_API_KEY}
      GoogleMapsUrl: ${GOOGLE_MAPS_URL}
      GooglePlacesUrl: ${GOOGLE_PLACES_URL}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:5103
      RabbitMQ__Uri: ${RABBIT_MQ_URI}
      MinIO__Endpoint: ${MINIO_ENDPOINT}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mytravels-mcp
    ports:
      - 5103:5103
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate-core-db:
        condition: service_completed_successfully
  # WEB UI
  web:
    container_name: mytravels-web
    image: mytravels-web:v1.0.4
    build:
      context: ../src
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
    ports:
      - 5100:80
    depends_on:
      - api
      - messaging
# Observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: mytravels-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (api/messaging)
      - "4318:4318"   # OTLP HTTP (browser RUM)
      - "8889:8889"   # Prometheus scrape target
    # No healthcheck: the contrib image is distroless (no wget/curl) so an
    # exec-based probe can't run. Services depend on it by start order only.

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mytravels-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"   # host 9091 — 9090 is already taken by the minio console
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.6.1
    container_name: mytravels-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API (Grafana explore / manual trace search)

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: mytravels-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: mytravels-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mytravels-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  pgdata:
    driver: local
  mqdata:
    driver: local
  mqconfig:
    driver: local
  minio-data:
    driver: local
  minio-config:
    driver: local
  prometheus-data:
    driver: local
  tempo-data:
    driver: local
  grafana-data:
    driver: local