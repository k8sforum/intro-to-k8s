services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-routes=true"

  tika:
    image: apache/tika:latest
    restart: unless-stopped

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    # TODO 1: `db` and `broker` both declare a healthcheck above. Change these
    # from the default `service_started` condition to `service_healthy`, so
    # webserver doesn't come up before Postgres/Redis can actually accept
    # connections.
    depends_on:
      db:
        condition: service_started
      broker:
        condition: service_started
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    environment:
      # TODO 2: point paperless at redis using the `broker` service's name
      # (format: redis://<host>:6379)
      PAPERLESS_REDIS:
      # TODO 3: point paperless at postgres using the `db` service's name,
      # plus the credentials declared on the `db` service above
      PAPERLESS_DBHOST:
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_SECRET_KEY: change-me-lab-secret
      PAPERLESS_URL: http://localhost:8000
      PAPERLESS_TIME_ZONE: Africa/Johannesburg
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      # TODO 4: enable Tika and point both endpoints at the services above
      # (gotenberg listens on :3000, tika on :9998)
      PAPERLESS_TIKA_ENABLED:
      PAPERLESS_TIKA_ENDPOINT:
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT:
    volumes:
      # TODO 5: paperless needs two more directories to be volumes, or your
      # documents and search index vanish on every `docker compose down`:
      #   /usr/src/paperless/data    (index, search database)
      #   /usr/src/paperless/media   (the actual documents + thumbnails)
      # Mount two named volumes here, then declare them below (TODO 6).

volumes:
  db-data:
  broker-data:
  # TODO 6: declare the two volumes you referenced in TODO 5
