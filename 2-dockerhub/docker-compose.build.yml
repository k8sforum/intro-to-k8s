# Build and push in one step, tagged for the host's native architecture:
#   macOS (arm64):    ARCH=arm64 docker compose -f docker-compose.build.yml build --push
#   Windows (amd64):  $env:ARCH="amd64"; docker compose -f docker-compose.build.yml build --push
#
# After both architectures are pushed, merge them into one multi-arch tag with
# scripts/merge-manifests.sh

services:
  migration-tool:
    image: tshepontlhokoa/mytravels-migrations:v1.0.8-${ARCH}
    build:
      context: ../src
      dockerfile: common/mytravels.migration/Dockerfile

  api:
    image: tshepontlhokoa/mytravels-api:v1.0.12-${ARCH}
    build:
      context: ../src
      dockerfile: api/mytravels.api/Dockerfile

  messaging:
    image: tshepontlhokoa/mytravels-messaging:v1.0.15-${ARCH}
    build:
      context: ../src
      dockerfile: messaging/mytravels.messaging/Dockerfile

  mcp:
    image: tshepontlhokoa/mytravels-mcp:v1.0.2-${ARCH}
    build:
      context: ../src
      dockerfile: api/mytravels.mcp/Dockerfile

  # The two VITE_* values are inlined into the JavaScript bundle by Vite at build
  # time, so they cannot normally be changed after the image is built. Building
  # with sentinel placeholders instead of real URLs defers that choice to deploy
  # time: the Kubernetes stages substitute them at pod start from a ConfigMap
  # (see 3-kubernetes/manifests/web/1-configmap.yaml).
  #
  # Both sentinels must be non-empty — telemetry.ts guards its OpenTelemetry setup
  # with `if (otlpEndpoint)`, and an unset build arg makes that branch statically
  # false, so Vite tree-shakes the whole browser-RUM block out of the bundle.
  #
  # Consequence: this image is NOT usable from plain `docker compose up` without a
  # substitution step — the browser would call the literal `__API_BASE_URL__`. The
  # Compose stages (1-dockerize, 2-dockerhub) pin earlier tags built with real URLs.
  web:
    image: tshepontlhokoa/mytravels-web:v1.0.8-${ARCH}
    build:
      context: ../src
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: __API_BASE_URL__
        VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: __OTLP_TRACES_ENDPOINT__