services:
#Storage - https://github.com/minio/minio
  minio:
    image: quay.io/minio/minio
    container_name: minio
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"   # S3 API
      - "9090:9090"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mytravels-rabbitmq
    ports:
      - "5672:5672"      # for messaging
      - "15672:15672"    # for the management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - mqdata:/var/lib/rabbitmq
      - mqconfig:/etc/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 10s
      retries: 5
#DBs
  # https://github.com/felipewom/docker-compose-postgres
  postgres:
    image: postgres:17.6-alpine
    container_name: mytravels-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -h localhost -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      
# DB Script Runner - runs after Postgres is healthy to execute custom SQL commands
  cleanup-migrations:
    image: postgres:17.6-alpine
    container_name: cleanup-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: |
      PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" <<'EOSQL'
      DO $$
      BEGIN
        IF EXISTS (
          SELECT 1 FROM information_schema.tables 
          WHERE table_schema='config' AND table_name='EFMigrationsHistory'
        ) THEN
          DELETE FROM "EFMigrationsHistory" WHERE "MigrationId" IN ('20600930075821_SeedData', '20590930075747_UpdateStoredProcedure');
        END IF;
      END
      $$;
      EOSQL
      
# Migrations
  migrate-core-db:
    image: tshepontlhokoa/mytravels-migrations:v1.0.7
    command: ["--connection", "${CORE_DB_CONTEXT}"]
    restart: "no"
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
    depends_on:
      postgres:
        condition: service_healthy
        
  # ASP.NET CORE API
  api:
    container_name: mytravels-api
    image: tshepontlhokoa/mytravels-api:v1.0.10
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
      GoogleApiKey: ${GOOGLE_API_KEY}
      GoogleMapsUrl: ${GOOGLE_MAPS_URL}
      GooglePlacesUrl: ${GOOGLE_PLACES_URL}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      RabbitMQ__Uri: ${RABBIT_MQ_URI}
      MinIO__Endpoint: ${MINIO_ENDPOINT}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
    ports:
      - 5101:5101
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate-core-db:
        condition: service_completed_successfully

  # MESSAGING APP
  messaging:
    container_name: mytravels-messaging
    image: tshepontlhokoa/mytravels-messaging:v1.0.13
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:5102
      RabbitMQ__Uri: ${RABBIT_MQ_URI}
      AnthropicApiKey: ${ANTHROPIC_API_KEY}
      AnthropicModel: ${ANTHROPIC_MODEL}
      MinIO__Endpoint: ${MINIO_ENDPOINT}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      GoogleApiKey: ${GOOGLE_API_KEY}
      GoogleMapsUrl: ${GOOGLE_MAPS_URL}
      GooglePlacesUrl: ${GOOGLE_PLACES_URL}
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
    ports:
      - 5102:5102
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate-core-db:
        condition: service_completed_successfully

  # MCP SERVER
  mcp:
    container_name: mytravels-mcp
    image: tshepontlhokoa/mytravels-mcp:v1.0.1
    environment:
      ConnectionStrings__CoreDbContext: ${CORE_DB_CONTEXT}
      GoogleApiKey: ${GOOGLE_API_KEY}
      GoogleMapsUrl: ${GOOGLE_MAPS_URL}
      GooglePlacesUrl: ${GOOGLE_PLACES_URL}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:5103
      RabbitMQ__Uri: ${RABBIT_MQ_URI}
      MinIO__Endpoint: ${MINIO_ENDPOINT}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      DOTNET_hostBuilder__reloadConfigOnChange: "false"
    ports:
      - 5103:5103
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate-core-db:
        condition: service_completed_successfully

  # The web image is built with sentinel placeholders (__API_BASE_URL__,
  # __OTLP_TRACES_ENDPOINT__ — see 2-dockerhub/docker-compose.build.yml) rather
  # than literal URLs, so it needs the same substitution step the k8s manifests
  # run as an init container (3-kubernetes/manifests/web/2-deployment.yaml):
  # copy the built site into a shared volume, sed the real URLs into it, then
  # have nginx serve that copy instead of the image's own (unsubstituted) docroot.
  render-web-config:
    container_name: mytravels-web-render-config
    image: tshepontlhokoa/mytravels-web:v1.0.7
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        cp -a /usr/share/nginx/html/. /docroot/
        find /docroot/assets -name '*.js' -exec sed -i \
          -e "s|__API_BASE_URL__|${VITE_API_BASE_URL}|g" \
          -e "s|__OTLP_TRACES_ENDPOINT__|${VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}|g" \
          {} +
        if grep -rq '__API_BASE_URL__\|__OTLP_TRACES_ENDPOINT__' /docroot/assets; then
          echo "ERROR: unsubstituted placeholders remain in the bundle" >&2
          grep -rlo '__API_BASE_URL__\|__OTLP_TRACES_ENDPOINT__' /docroot/assets >&2
          exit 1
        fi
        echo "substituted VITE_API_BASE_URL=${VITE_API_BASE_URL}"
        echo "substituted VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
    volumes:
      - web-docroot:/docroot

  # WEB UI
  web:
    container_name: mytravels-web
    image: tshepontlhokoa/mytravels-web:v1.0.7
    ports:
      - 5100:80
    volumes:
      - web-docroot:/usr/share/nginx/html
    depends_on:
      api:
        condition: service_started
      render-web-config:
        condition: service_completed_successfully

volumes:
  pgdata:
    driver: local
  mqdata:
    driver: local
  mqconfig:
    driver: local
  minio-data:
    driver: local
  minio-config:
    driver: local
  web-docroot:
    driver: local