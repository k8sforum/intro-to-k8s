apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  ConnectionStrings__CoreDbContext: {{ .Values.shared.connectionString | quote }}
  RabbitMQ__Uri: {{ .Values.shared.rabbitMqUri | quote }}
  MinIO__AccessKey: {{ .Values.shared.minioAccessKey | quote }}
  MinIO__SecretKey: {{ .Values.shared.minioSecretKey | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "mytravels.labels" (dict "app" "api" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.api.port }}"
            - name: GoogleMapsUrl
              value: {{ .Values.shared.googleMapsUrl | quote }}
            - name: GooglePlacesUrl
              value: {{ .Values.shared.googlePlacesUrl | quote }}
            - name: MinIO__Endpoint
              value: {{ .Values.shared.minioEndpoint | quote }}
            - name: ConnectionStrings__CoreDbContext
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ConnectionStrings__CoreDbContext
            - name: RabbitMQ__Uri
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: RabbitMQ__Uri
            - name: MinIO__AccessKey
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MinIO__AccessKey
            - name: MinIO__SecretKey
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MinIO__SecretKey
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /swagger
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "mytravels.labels" (dict "app" "api" "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
