apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-env-cm
  namespace: k8s-ns
data:
  K8S_FORUM_SESSION_NUMBER: "4"
  K8S_FORUM_SESSION_TITLE: "Core Objects"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-pv-manual
spec:
  storageClassName: manual
  capacity:
    storage: 10Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/k8s-pv-manual
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-k8scluster-agent-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-pvc-dynamic
  namespace: k8s-ns
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-pvc-manual
  namespace: k8s-ns
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deployment
  namespace: k8s-ns
spec:
  # One replica: both volumes are ReadWriteOnce and node-local
  replicas: 1
  selector:
    matchLabels:
      app: k8s-deployment
  template:
    metadata:
      labels:
        app: k8s-deployment
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: k8s-env-cm
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: data-dynamic
              mountPath: /data/dynamic
            - name: data-manual
              mountPath: /data/manual
      volumes:
        - name: html
          configMap:
            name: k8s-cm
        - name: data-dynamic
          persistentVolumeClaim:
            claimName: k8s-pvc-dynamic
        - name: data-manual
          persistentVolumeClaim:
            claimName: k8s-pvc-manual
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-service
  namespace: k8s-ns
spec:
  type: LoadBalancer
  selector:
    app: k8s-deployment
  ports:
    - port: 8081
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-ingress
  namespace: k8s-ns
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-service
                port:
                  number: 8081
