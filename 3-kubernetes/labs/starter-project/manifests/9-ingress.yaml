# Reuses the Traefik installation already configured for MyTravels
# (3-kubernetes/manifests/8-traefik-config.yaml) - no separate Traefik setup
# needed for this lab.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-ingress
  namespace: paperless-lab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    # TODO: fill in the host (add it to /etc/hosts too) and the backend
    # service/port from paperless/5-service.yaml
    - host:
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name:
                port:
                  number:
