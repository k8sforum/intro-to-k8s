apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-config
  namespace: paperless-lab
data:
  PAPERLESS_DBNAME: paperless
  PAPERLESS_TIME_ZONE: Africa/Johannesburg
  PAPERLESS_OCR_LANGUAGE: eng
  # TODO: PAPERLESS_DBHOST needs to resolve to the postgres Service you
  # created earlier. Inside a namespace, a Service's own name is enough
  # (Kubernetes DNS handles the rest) - what name did you give it?
  PAPERLESS_DBHOST:
  # TODO: same idea, but for redis - format is redis://<service-name>:6379
  PAPERLESS_REDIS:
  # TODO: this should be the URL a browser will actually use to reach
  # paperless once the Ingress is up - see manifests/9-ingress.yaml
  PAPERLESS_URL:
