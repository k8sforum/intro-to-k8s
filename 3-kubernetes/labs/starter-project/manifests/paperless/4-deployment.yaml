apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless-lab
  labels:
    app: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # TODO: pull every key from paperless-config and paperless-secret
          # into this container's environment in one shot - see
          # https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/#configure-all-key-value-pairs-in-a-configmap-as-container-environment-variables
          envFrom:
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # TODO: mount the two PVCs from 3-pvc.yaml at the paths paperless
          # expects - check the stage 1 lab's completed-project compose file
          # for the exact container paths if you don't remember them.
          volumeMounts:
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: paperless-data
          persistentVolumeClaim:
            claimName: paperless-data-pvc
        - name: paperless-media
          persistentVolumeClaim:
            claimName: paperless-media-pvc
