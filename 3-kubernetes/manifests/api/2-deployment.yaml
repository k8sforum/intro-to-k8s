apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mytravels-default
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: tshepontlhokoa/mytravels-api:v1.0.14
          ports:
            - name: http
              containerPort: 5101
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:5101
            - name: GoogleMapsUrl
              value: https://maps.googleapis.com
            - name: GooglePlacesUrl
              value: https://places.googleapis.com
            - name: ObjectStorage__Endpoint
              value: seaweedfs-s3:8333
            - name: Solr__Url
              value: http://solr:8983
            - name: Solr__Collection
              value: mytravels-pois
            - name: ConnectionStrings__CoreDbContext
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ConnectionStrings__CoreDbContext
            - name: RabbitMQ__Uri
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: RabbitMQ__Uri
            - name: ObjectStorage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ObjectStorage__AccessKey
            - name: ObjectStorage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ObjectStorage__SecretKey
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_SERVICE_NAME
              value: mytravels-api
            - name: Flagsmith__ApiUri
              value: http://flagsmith:8000/api/v1/
            - name: Flagsmith__ServerSideEnvironmentKey
              valueFrom:
                secretKeyRef:
                  name: flagsmith-keys
                  key: FLAGSMITH_SERVER_SIDE_ENVIRONMENT_KEY
            - name: DOTNET_hostBuilder__reloadConfigOnChange
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /swagger
              port: 5101
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
