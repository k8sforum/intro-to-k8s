# Django-side secrets only. Postgres credentials come from the EXISTING
# postgres-secret (manifests/postgres/1-secret.yaml) — Flagsmith shares the same
# running mytravels-postgres instance in a second database (FeatureDb), not a
# second container, so its DB credentials are not duplicated here.
#
# Replace both values before using outside a local dev cluster — they match the
# placeholders in 1-dockerize/.env.example (FLAGSMITH_DJANGO_SECRET_KEY,
# FLAGSMITH_ADMIN_PASSWORD), not real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: flagsmith-secret
  namespace: mytravels-default
type: Opaque
data:
  # All values must be base64-encoded: echo -n "value" | base64
  DJANGO_SECRET_KEY: PFlPVVJfRkxBR1NNSVRIX0RKQU5HT19TRUNSRVRfS0VZPg==
  FLAGSMITH_ADMIN_PASSWORD: PFlPVVJfRkxBR1NNSVRIX0FETUlOX1BBU1NXT1JEPg==
