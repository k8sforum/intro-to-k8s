# Runs Flagsmith's Django migrations against FeatureDb. Must run after
# 2-create-db-job.yaml completes (the database has to exist first) - see the
# runbook's two-phase apply note.
apiVersion: batch/v1
kind: Job
metadata:
  name: flagsmith-migrate
  namespace: mytravels-default
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flagsmith-migrate
          image: docker.flagsmith.com/flagsmith/flagsmith:2.261.0
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: flagsmith-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/FeatureDb"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flagsmith-secret
                  key: DJANGO_SECRET_KEY
