# Creates the superuser + organisation + project (idempotent - a no-op on
# rerun). Logs a password-reset link rather than a usable password; 6-seed-job.yaml
# sets a real password directly via the Django ORM instead, since the reset link
# is only needed for the HTTP reset-password flow, which the ORM path skips.
# Must run after 3-migrate-job.yaml completes - see the runbook's two-phase
# apply note.
apiVersion: batch/v1
kind: Job
metadata:
  name: flagsmith-bootstrap
  namespace: mytravels-default
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flagsmith-bootstrap
          image: docker.flagsmith.com/flagsmith/flagsmith:2.261.0
          args: ["bootstrap"]
          envFrom:
            - configMapRef:
                name: flagsmith-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/FeatureDb"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flagsmith-secret
                  key: DJANGO_SECRET_KEY
