# Flagsmith's background task processor (analytics, audit log processing,
# etc). Does not serve HTTP, so unlike 4-deployment.yaml it has no ports and no
# probes - same as its Compose counterpart, which also defines no healthcheck.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagsmith-task-processor
  namespace: mytravels-default
  labels:
    app: flagsmith-task-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagsmith-task-processor
  template:
    metadata:
      labels:
        app: flagsmith-task-processor
    spec:
      containers:
        - name: flagsmith-task-processor
          image: docker.flagsmith.com/flagsmith/flagsmith:2.261.0
          args: ["run-task-processor"]
          envFrom:
            - configMapRef:
                name: flagsmith-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/FeatureDb"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flagsmith-secret
                  key: DJANGO_SECRET_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
