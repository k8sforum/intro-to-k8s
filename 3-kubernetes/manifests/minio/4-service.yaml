apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: mytravels-default
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: mytravels-default
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: console
      port: 9090
      targetPort: 9090
      protocol: TCP
