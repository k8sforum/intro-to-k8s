        {
          "id": 5,
          "title": "Container filesystem usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "container_fs_usage_bytes{job=\"cadvisor\", name!=\"\"}",
              "legendFormat": "{{name}}"
            }
          ]
        }
