apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: mytravels-default
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: mytravels
        orgId: 1
        folder: MyTravels
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  mytravels-overview.json: |
    {
      "title": "MyTravels Overview",
      "uid": "mytravels-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "API request rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{job=\"otel-collector\"}[1m])) by (http_route)",
              "legendFormat": "{{http_route}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "API error rate (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{job=\"otel-collector\", http_response_status_code=~\"5..\"}[1m]))",
              "legendFormat": "5xx/s"
            }
          ]
        },
        {
          "id": 3,
          "title": "RabbitMQ queue depth",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rabbitmq_queue_messages_ready{job=\"rabbitmq\"}",
              "legendFormat": "{{queue}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Postgres active connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "pg_stat_activity_count{job=\"postgres\"}",
              "legendFormat": "{{datname}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Container CPU usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{job=\"cadvisor\", name!=\"\"}[1m])) by (name)",
              "legendFormat": "{{name}}"
            }
          ]
        }
      ]
    }
  mytravels-postgres.json: |
    {
      "title": "MyTravels Postgres",
      "uid": "mytravels-postgres",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Postgres up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "pg_up{job=\"postgres\"}",
              "legendFormat": "up"
            }
          ]
        },
        {
          "id": 2,
          "title": "Active connections by state",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(pg_stat_activity_count{job=\"postgres\"}) by (state)",
              "legendFormat": "{{state}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Transactions per second",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_xact_commit{job=\"postgres\"}[1m]))",
              "legendFormat": "commit"
            },
            {
              "expr": "sum(rate(pg_stat_database_xact_rollback{job=\"postgres\"}[1m]))",
              "legendFormat": "rollback"
            }
          ]
        },
        {
          "id": 4,
          "title": "Cache hit ratio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_blks_hit{job=\"postgres\"}[5m])) / (sum(rate(pg_stat_database_blks_hit{job=\"postgres\"}[5m])) + sum(rate(pg_stat_database_blks_read{job=\"postgres\"}[5m])))",
              "legendFormat": "hit ratio"
            }
          ]
        },
        {
          "id": 5,
          "title": "Database size",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "pg_database_size_bytes{job=\"postgres\"}",
              "legendFormat": "{{datname}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Deadlocks",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_deadlocks{job=\"postgres\"}[5m])) by (datname)",
              "legendFormat": "{{datname}}"
            }
          ]
        }
      ]
    }
  mytravels-rabbitmq.json: |
    {
      "title": "MyTravels RabbitMQ",
      "uid": "mytravels-rabbitmq",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Queue depth (ready)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rabbitmq_queue_messages_ready{job=\"rabbitmq\"}",
              "legendFormat": "{{queue}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Unacked messages",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rabbitmq_queue_messages_unacked{job=\"rabbitmq\"}",
              "legendFormat": "{{queue}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Publish rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(rabbitmq_channel_messages_published_total{job=\"rabbitmq\"}[1m]))",
              "legendFormat": "published/s"
            }
          ]
        },
        {
          "id": 4,
          "title": "Deliver / ack rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(rabbitmq_channel_messages_delivered_total{job=\"rabbitmq\"}[1m]))",
              "legendFormat": "delivered/s"
            },
            {
              "expr": "sum(rate(rabbitmq_channel_messages_acked_total{job=\"rabbitmq\"}[1m]))",
              "legendFormat": "acked/s"
            }
          ]
        },
        {
          "id": 5,
          "title": "Consumers per queue",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rabbitmq_queue_consumers{job=\"rabbitmq\"}",
              "legendFormat": "{{queue}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rabbitmq_connections{job=\"rabbitmq\"}",
              "legendFormat": "connections"
            }
          ]
        }
      ]
    }
  mytravels-containers.json: |
    {
      "title": "MyTravels Containers",
      "uid": "mytravels-containers",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Container CPU usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{job=\"cadvisor\", name!=\"\"}[1m])) by (name)",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Container memory working set",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{job=\"cadvisor\", name!=\"\"}",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Container network receive",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{job=\"cadvisor\", name!=\"\"}[1m])) by (name)",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Container network transmit",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
