  mytravels-minio.json: |
    {
      "title": "MyTravels MinIO",
      "uid": "mytravels-minio",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Cluster nodes online / offline",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "minio_cluster_nodes_online_total{job=\"minio\"}",
              "legendFormat": "online"
            },
            {
              "expr": "minio_cluster_nodes_offline_total{job=\"minio\"}",
              "legendFormat": "offline"
            }
          ]
        },
        {
          "id": 2,
          "title": "Usable capacity",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "minio_cluster_capacity_usable_total_bytes{job=\"minio\"}",
              "legendFormat": "total"
            },
            {
              "expr": "minio_cluster_capacity_usable_free_bytes{job=\"minio\"}",
              "legendFormat": "free"
            }
          ]
        },
        {
          "id": 3,
          "title": "S3 request rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(minio_s3_requests_total{job=\"minio\"}[1m]))",
              "legendFormat": "requests/s"
            }
          ]
        },
        {
          "id": 4,
          "title": "S3 request errors",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(minio_s3_requests_errors_total{job=\"minio\"}[1m]))",
              "legendFormat": "errors/s"
            }
          ]
        },
        {
          "id": 5,
          "title": "S3 traffic",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(minio_s3_traffic_sent_bytes{job=\"minio\"}[1m]))",
              "legendFormat": "sent"
            },
            {
              "expr": "sum(rate(minio_s3_traffic_received_bytes{job=\"minio\"}[1m]))",
              "legendFormat": "received"
            }
          ]
        }
      ]
    }
  mytravels-otel.json: |
    {
      "title": "MyTravels API & Messaging (OTel)",
      "uid": "mytravels-otel",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "ASP.NET Core (HTTP server)",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "title": "Request rate by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{job=\"otel-collector\"}[1m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error rate (5xx) by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{job=\"otel-collector\", http_response_status_code=~\"5..\"}[1m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Request duration p95 by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{job=\"otel-collector\"}[5m])) by (le, service_name))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Outbound HTTP client",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 6,
          "title": "Outbound request rate by target",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_client_request_duration_seconds_count{job=\"otel-collector\"}[1m])) by (service_name, server_address)",
              "legendFormat": "{{service_name}} -> {{server_address}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Outbound request duration p95 by target",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_client_request_duration_seconds_bucket{job=\"otel-collector\"}[5m])) by (le, server_address))",
              "legendFormat": "{{server_address}}"
            }
          ]
        },
        {
          "id": 8,
          "title": ".NET runtime",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 9,
          "title": "GC heap size by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "process_runtime_dotnet_gc_heap_size_bytes{job=\"otel-collector\"}",
              "legendFormat": "{{service_name}} gen{{generation}}"
            }
          ]
        },
        {
          "id": 10,
          "title": "GC collections rate by generation",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(process_runtime_dotnet_gc_collections_count_total{job=\"otel-collector\"}[5m])) by (service_name, generation)",
              "legendFormat": "{{service_name}} gen{{generation}}"
            }
          ]
        },
        {
          "id": 11,
          "title": "Allocation rate by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(process_runtime_dotnet_gc_allocations_size_bytes_total{job=\"otel-collector\"}[1m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 12,
          "title": "Thread pool queue length",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 35
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "process_runtime_dotnet_thread_pool_queue_length{job=\"otel-collector\"}",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 13,
          "title": "Thread pool thread count",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 43
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "process_runtime_dotnet_thread_pool_threads_count{job=\"otel-collector\"}",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 14,
          "title": "Exceptions rate by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 43
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(process_runtime_dotnet_exceptions_count_total{job=\"otel-collector\"}[5m])) by (service_name)",
              "legendFormat": "{{service_name}}"
            }
          ]
        }
      ]
    }
