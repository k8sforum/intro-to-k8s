apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mytravels-default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8889"]

      - job_name: postgres
        static_configs:
          - targets: ["postgres-exporter:9187"]

      - job_name: rabbitmq
        metrics_path: /metrics
        static_configs:
          - targets: ["rabbitmq:15692"]

      - job_name: minio
        metrics_path: /minio/v2/metrics/cluster
        static_configs:
          - targets: ["minio:9000"]

      # cadvisor is a DaemonSet — discovered via the headless cadvisor
      # Service's SRV record so every node's pod gets scraped, not just one.
      - job_name: cadvisor
        dns_sd_configs:
          - names: ["_metrics._tcp.cadvisor.mytravels-default.svc.cluster.local"]
            type: SRV
