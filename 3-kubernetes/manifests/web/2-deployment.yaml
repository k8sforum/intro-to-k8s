# Static React build served by nginx (see src/web/Dockerfile).
#
# Vite inlines VITE_* values into the JavaScript bundle at image build time, so
# there is no env var nginx could read to change them. To make them configurable
# per cluster anyway, the image is built with sentinel placeholders
# (VITE_API_BASE_URL=__API_BASE_URL__,
#  VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=__OTLP_TRACES_ENDPOINT__,
#  VITE_FLAGSMITH_ENVIRONMENT_ID=__FLAGSMITH_ENVIRONMENT_ID__,
#  VITE_FLAGSMITH_API_URL=__FLAGSMITH_API_URL__ — see
# 2-dockerhub/docker-compose.build.yml) and the init container below rewrites them
# from the web-config ConfigMap into a copy of the site before nginx serves it.
# The Flagsmith environment ID is Flagsmith-generated rather than hand-configured,
# so it comes from the flagsmith-keys Secret (produced by
# manifests/flagsmith/6-seed-job.yaml) instead of the web-config ConfigMap.
#
# The image layer itself stays read-only: the init container copies the site into
# an emptyDir, patches the copy, and nginx mounts the emptyDir over its docroot.
#
# To change either URL, edit 1-configmap.yaml and roll the Deployment — the init
# container re-runs on every new pod. No rebuild, no tag bump.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mytravels-default
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        # Same image as the runtime container, so the copy is guaranteed to match
        # what nginx would otherwise have served.
        - name: render-config
          image: tshepontlhokoa/mytravels-web:v1.0.9
          command:
            - sh
            - -c
            - |
              set -eu
              cp -a /usr/share/nginx/html/. /docroot/
              find /docroot/assets -name '*.js' -exec sed -i \
                -e "s|__API_BASE_URL__|${VITE_API_BASE_URL}|g" \
                -e "s|__OTLP_TRACES_ENDPOINT__|${VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}|g" \
                -e "s|__FLAGSMITH_ENVIRONMENT_ID__|${VITE_FLAGSMITH_ENVIRONMENT_ID}|g" \
                -e "s|__FLAGSMITH_API_URL__|${VITE_FLAGSMITH_API_URL}|g" \
                {} +
              # Fail the pod rather than serve a bundle that would call the
              # literal string "__API_BASE_URL__" from the browser.
              if grep -rq '__API_BASE_URL__\|__OTLP_TRACES_ENDPOINT__\|__FLAGSMITH_ENVIRONMENT_ID__\|__FLAGSMITH_API_URL__' /docroot/assets; then
                echo "ERROR: unsubstituted placeholders remain in the bundle" >&2
                grep -rlo '__API_BASE_URL__\|__OTLP_TRACES_ENDPOINT__\|__FLAGSMITH_ENVIRONMENT_ID__\|__FLAGSMITH_API_URL__' /docroot/assets >&2
                exit 1
              fi
              echo "substituted VITE_API_BASE_URL=${VITE_API_BASE_URL}"
              echo "substituted VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}"
              echo "substituted VITE_FLAGSMITH_ENVIRONMENT_ID=${VITE_FLAGSMITH_ENVIRONMENT_ID}"
              echo "substituted VITE_FLAGSMITH_API_URL=${VITE_FLAGSMITH_API_URL}"
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: flagsmith-keys
          volumeMounts:
            - name: docroot
              mountPath: /docroot
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: web
          image: tshepontlhokoa/mytravels-web:v1.0.9
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: docroot
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: docroot
          emptyDir: {}
