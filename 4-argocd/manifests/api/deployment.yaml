apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mytravels-default
  labels:
    app: api
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: tshepontlhokoa/mytravels-api:v1.0.15
          ports:
            - name: http
              containerPort: 5101
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:5101
            - name: GoogleMapsUrl
              value: https://maps.googleapis.com
            - name: GooglePlacesUrl
              value: https://places.googleapis.com
            - name: ObjectStorage__Endpoint
              value: seaweedfs-s3:8333
            - name: Solr__Url
              value: http://solr:8983
            - name: Solr__Collection
              value: mytravels-pois
            - name: ConnectionStrings__CoreDbContext
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ConnectionStrings__CoreDbContext
            - name: RabbitMQ__Uri
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: RabbitMQ__Uri
            - name: ObjectStorage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ObjectStorage__AccessKey
            - name: ObjectStorage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ObjectStorage__SecretKey
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: Flagsmith__ApiUri
              value: http://flagsmith:8000/api/v1/
            - name: Flagsmith__ServerSideEnvironmentKey
              valueFrom:
                secretKeyRef:
                  name: flagsmith-keys
                  key: FLAGSMITH_SERVER_SIDE_ENVIRONMENT_KEY
            # Search-term rewriting, used only while the enable-nlp-search flag is on. optional: an absent
            # key just means raw-term search, so api still starts without one.
            - name: AnthropicApiKey
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: AnthropicApiKey
                  optional: true
            - name: AnthropicModel
              value: claude-haiku-4-5
            - name: DOTNET_hostBuilder__reloadConfigOnChange
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /swagger
              port: 5101
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
