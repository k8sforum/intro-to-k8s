apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: mytravels-default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-kubernetes-reader
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - namespaces
      - resourcequotas
      - limitranges
      - events
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources:
      - ingresses
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources:
      - pods
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-kubernetes-reader
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-kubernetes-reader
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: mytravels-default
---
# Long-lived token for the backstage ServiceAccount (k8s 1.24+)
apiVersion: v1
kind: Secret
metadata:
  name: backstage-token
  namespace: mytravels-default
  annotations:
    # One wave later than the ServiceAccount: Argo's built-in kind ordering places
    # Secret *before* ServiceAccount, so without this the token controller would
    # have to wait for the SA to catch up.
    argocd.argoproj.io/sync-wave: "4"
    kubernetes.io/service-account.name: backstage
type: kubernetes.io/service-account-token
