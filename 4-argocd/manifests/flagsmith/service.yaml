# Selector matches only the `flagsmith` (serve) Deployment, not
# flagsmith-task-processor (deliberately labelled differently — it serves no
# HTTP traffic).
apiVersion: v1
kind: Service
metadata:
  name: flagsmith
  namespace: mytravels-default
  labels:
    app: flagsmith
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  selector:
    app: flagsmith
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
