apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: mytravels-default
  labels:
    app: cadvisor
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      # cadvisor reads cgroups and the container runtime directly; it never calls the
      # Kubernetes API. Declining the token also removes the projected volume at
      # /var/run/secrets/..., which cannot be created underneath the read-only
      # /var/run hostPath mount below (the image symlinks /var/run -> /run).
      automountServiceAccountToken: false
      initContainers:
        - name: increase-ulimit
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Increasing file descriptor limits..."
              sysctl -w fs.file-max=2097152 fs.nr_open=2097152 || true
              cat /proc/sys/fs/file-max /proc/sys/fs/nr_open
          securityContext:
            privileged: true
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
              readOnly: true
          securityContext:
            privileged: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: var-run
          hostPath:
            path: /var/run
        - name: sys
          hostPath:
            path: /sys
        - name: docker
          hostPath:
            path: /var/lib/docker
            type: DirectoryOrCreate
