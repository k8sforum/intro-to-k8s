apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: mytravels-default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: mytravels
        orgId: 1
        folder: MyTravels
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  mytravels-overview.json: |
    {
      "title": "MyTravels Overview",
      "uid": "mytravels-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "API request rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{job=\"otel-collector\"}[1m])) by (http_route)",
              "legendFormat": "{{http_route}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "API error rate (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{job=\"otel-collector\", http_response_status_code=~\"5..\"}[1m]))",
              "legendFormat": "5xx/s"
            }
          ]
        },
        {
          "id": 3,
          "title": "RabbitMQ queue depth",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rabbitmq_queue_messages_ready{job=\"rabbitmq\"}",
              "legendFormat": "{{queue}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Postgres active connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "pg_stat_activity_count{job=\"postgres\"}",
              "legendFormat": "{{datname}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Container CPU usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{job=\"cadvisor\", name!=\"\"}[1m])) by (name)",
              "legendFormat": "{{name}}"
            }
          ]
        }
      ]
    }
