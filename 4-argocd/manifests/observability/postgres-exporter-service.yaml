apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: mytravels-default
  labels:
    app: postgres-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
      protocol: TCP
