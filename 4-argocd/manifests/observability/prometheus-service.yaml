apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mytravels-default
  labels:
    app: prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
