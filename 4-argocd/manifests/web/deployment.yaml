# Static React build served by nginx (see src/web/Dockerfile).
#
# The API URL is NOT configurable here — Vite inlines VITE_API_BASE_URL into the
# JavaScript bundle at image build time, so the browser calls whatever host the
# image was built with. v1.0.5 was built with VITE_API_BASE_URL=http://api.mytravels.local:8080,
# so it reaches the API through the Traefik ingress. If you rebuild, keep that
# build arg (or update it) and bump the tag below to match.
#
# Same applies to VITE_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT (browser RUM traces):
# it must be baked in at build time as http://otel.mytravels.local:8080/v1/traces
# so the browser can reach the collector through the ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mytravels-default
  labels:
    app: web
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: tshepontlhokoa/mytravels-web:v1.0.6
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
