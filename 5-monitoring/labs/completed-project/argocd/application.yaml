# Same idea as 5-monitoring/argocd/application.yaml in the main course: one
# object tells Argo CD "make the cluster look like this folder in git."
#
# Uses the built-in `default` AppProject rather than a dedicated one, unlike
# the main course's `mytravels` AppProject - a deliberate shortcut so this lab
# stays focused on sync-waves and self-heal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-lab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/k8sforum/intro-to-k8s.git
    targetRevision: main
    path: 5-monitoring/labs/completed-project/manifests
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: paperless-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
