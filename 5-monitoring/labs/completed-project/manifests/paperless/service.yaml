apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless-lab
  labels:
    app: paperless
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app: paperless
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
