# Reuses the Traefik installation already configured for MyTravels.
# TODO: add argocd.argoproj.io/sync-wave: "2" under metadata (see
# paperless/secret.yaml for why - this should come after paperless itself).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-ingress
  namespace: paperless-lab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: paperless.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless
                port:
                  number: 8000
