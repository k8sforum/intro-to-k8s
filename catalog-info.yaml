apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: intro-to-k8s
  description: Kubernetes learning repo — MyTravels app across multiple stages
spec:
  targets:
    - ./catalog-info.yaml
---
# ──────────────────────────────────────────────
# SYSTEM
# ──────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: mytravels
  title: MyTravels
  description: Geolocation-based POI management system used as the learning vehicle in this Kubernetes journey
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
spec:
  owner: user:tshepo.ntlhokoa
---
# ──────────────────────────────────────────────
# API CONTRACT
# ──────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mytravels-rest-api
  title: MyTravels REST API
  description: OpenAPI contract for POI management — create/query/tag points of interest, upload images
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
  links:
    - url: http://localhost:5101/swagger
      title: Swagger UI (.NET)
      icon: web
    - url: http://localhost:3000/swagger
      title: Swagger UI (NestJS)
      icon: web
spec:
  type: openapi
  lifecycle: experimental
  owner: user:tshepo.ntlhokoa
  system: mytravels
  definition: |
    openapi: "3.0.0"
    info:
      title: MyTravels API
      version: "1.0.0"
    paths: {}
---
# ──────────────────────────────────────────────
# COMPONENTS — .NET stack (3-kubernetes)
# ──────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mytravels-api
  title: MyTravels API (.NET)
  description: REST API for POI management — ASP.NET Core 10
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
    backstage.io/source-location: url:./3-kubernetes/api
    backstage.io/kubernetes-namespace: mytravels-default
    backstage.io/kubernetes-label-selector: app=api
    # SBOM — NuGet packages (direct + transitive via shared libs)
    mytravels/nuget-packages: >
      Microsoft.AspNetCore.Cors:2.3.0,
      Microsoft.EntityFrameworkCore:9.0.9,
      Npgsql.EntityFrameworkCore.PostgreSQL:9.0.4,
      Newtonsoft.Json:13.0.4,
      Swashbuckle.AspNetCore:9.0.5,
      Flurl.Http:4.0.2,
      MetadataExtractor:2.8.1,
      Polly:8.5.2,
      RabbitMQ.Client:7.1.2,
      Minio:6.0.5,
      Azure.Storage.Blobs:12.24.0,
      Geolocation:1.2.1,
      System.Security.Cryptography.Xml:10.0.6
  links:
    - url: http://localhost:5101/swagger
      title: Swagger UI
      icon: web
spec:
  type: service
  lifecycle: experimental
  owner: user:tshepo.ntlhokoa
  system: mytravels
  providesApis:
    - mytravels-rest-api
  dependsOn:
    - resource:mytravels-postgres
    - resource:mytravels-rabbitmq
    - resource:mytravels-minio
    - resource:mytravels-google-maps
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mytravels-messaging
  title: MyTravels Messaging Worker (.NET)
  description: Background worker — image resizing (Magick.NET) and address resolution via RabbitMQ
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
    backstage.io/source-location: url:./3-kubernetes/messaging
    backstage.io/kubernetes-namespace: mytravels-default
    backstage.io/kubernetes-label-selector: app=messaging
    # SBOM — NuGet packages
    mytravels/nuget-packages: >
      Magick.NET-Q16-AnyCPU:14.10.0,
      Microsoft.EntityFrameworkCore.Relational:9.0.9,
      RabbitMQ.Client:7.1.2,
      Flurl.Http:4.0.2,
      MetadataExtractor:2.8.1,
      Polly:8.5.2,
      Npgsql.EntityFrameworkCore.PostgreSQL:9.0.4,
      Minio:6.0.5,
      Azure.Storage.Blobs:12.24.0,
      Geolocation:1.2.1,
      Newtonsoft.Json:13.0.4
spec:
  type: service
  lifecycle: experimental
  owner: user:tshepo.ntlhokoa
  system: mytravels
  dependsOn:
    - resource:mytravels-postgres
    - resource:mytravels-rabbitmq
    - resource:mytravels-minio
    - resource:mytravels-google-maps
---
# ──────────────────────────────────────────────
# COMPONENTS — NestJS stack (2-dockerize_nestjs)
# ──────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mytravels-api-nestjs
  title: MyTravels API (NestJS)
  description: REST API for POI management — NestJS variant of the same app
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
    backstage.io/source-location: url:./2-dockerize_nestjs/apps/api
    # SBOM — npm packages
    mytravels/npm-packages: >
      @nestjs/common:^10.4.0,
      @nestjs/core:^10.4.0,
      @nestjs/swagger:^7.4.0,
      @nestjs/typeorm:^10.0.2,
      @nestjs/platform-express:^10.4.0,
      typeorm:^0.3.20,
      pg:^8.13.0,
      amqplib:^0.10.4,
      minio:^8.0.2,
      axios:^1.7.0,
      exifr:^7.1.3,
      sharp:^0.33.5,
      class-validator:^0.14.1,
      class-transformer:^0.5.1,
      uuid:^9.0.1,
      rxjs:^7.8.1
  links:
    - url: http://localhost:3000/swagger
      title: Swagger UI
      icon: web
spec:
  type: service
  lifecycle: experimental
  owner: user:tshepo.ntlhokoa
  system: mytravels
  providesApis:
    - mytravels-rest-api
  dependsOn:
    - resource:mytravels-postgres
    - resource:mytravels-rabbitmq
    - resource:mytravels-minio
    - resource:mytravels-google-maps
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mytravels-messaging-nestjs
  title: MyTravels Messaging Worker (NestJS)
  description: Background worker — image resizing (sharp) and address resolution, NestJS variant
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
    backstage.io/source-location: url:./2-dockerize_nestjs/apps/messaging
    # SBOM — npm packages (shared monorepo package.json)
    mytravels/npm-packages: >
      @nestjs/common:^10.4.0,
      @nestjs/core:^10.4.0,
      @nestjs/microservices:^10.4.0,
      typeorm:^0.3.20,
      pg:^8.13.0,
      amqplib:^0.10.4,
      minio:^8.0.2,
      axios:^1.7.0,
      exifr:^7.1.3,
      sharp:^0.33.5,
      rxjs:^7.8.1
spec:
  type: service
  lifecycle: experimental
  owner: user:tshepo.ntlhokoa
  system: mytravels
  dependsOn:
    - resource:mytravels-postgres
    - resource:mytravels-rabbitmq
    - resource:mytravels-minio
    - resource:mytravels-google-maps
---
# ──────────────────────────────────────────────
# RESOURCES — infrastructure dependencies
# ──────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mytravels-postgres
  title: PostgreSQL
  description: PostgreSQL 17 — primary relational store for POIs, tags, audit logs, and lookup tables
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
spec:
  type: database
  owner: user:tshepo.ntlhokoa
  system: mytravels
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mytravels-rabbitmq
  title: RabbitMQ
  description: RabbitMQ 3 — message broker for resize-image and append-formatted-address exchanges
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
spec:
  type: message-broker
  owner: user:tshepo.ntlhokoa
  system: mytravels
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mytravels-minio
  title: MinIO
  description: MinIO S3-compatible object storage — uploaded-images and resized-images buckets
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
spec:
  type: storage
  owner: user:tshepo.ntlhokoa
  system: mytravels
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mytravels-google-maps
  title: Google Maps API
  description: External Google Maps Geocoding and Places APIs — resolves coordinates to formatted addresses
  annotations:
    github.com/project-slug: k8sforum/intro-to-k8s
spec:
  type: external-service
  owner: user:tshepo.ntlhokoa
  system: mytravels
