# Create a Kubernetes deployment named k8s-deployment in the k8s-ns namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deployment
  namespace: k8s-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-deployment
  template:
    metadata:
      labels:
        app: k8s-deployment
    spec:
      containers:
        - name: nginx
          image: nginx
---
# Create a Kubernetes service of type LoadBalancer for the k8s-deployment in the k8s-ns namespace
apiVersion: v1
kind: Service
metadata:
  name: k8s-service
  namespace: k8s-ns
spec:
  type: LoadBalancer
  selector:
    app: k8s-deployment
  ports:
    - port: 8081
      targetPort: 80
---
# Create a Kubernetes ingress for the k8s-service in the k8s-ns namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-ingress
  namespace: k8s-ns
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-service
                port:
                  number: 8081
