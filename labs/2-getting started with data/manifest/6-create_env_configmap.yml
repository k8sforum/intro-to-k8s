# This manifest is specifically for creating environment ConfigMap and related resources.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-env-cm
  namespace: k8s-ns
data:
  K8S_FORUM_SESSION_NUMBER: "4"
  K8S_FORUM_SESSION_TITLE: "Core Objects"
---
# Deployment manifest for the k8s-ns namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deployment
  namespace: k8s-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-deployment
  template:
    metadata:
      labels:
        app: k8s-deployment
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: k8s-env-cm
          volumeMounts:
            - name: index
              mountPath: /usr/share/nginx/html
      volumes:
        - name: index
          configMap:
            name: k8s-cm
---
# Service manifest for the k8s-ns namespace.
apiVersion: v1
kind: Service
metadata:
  name: k8s-service
  namespace: k8s-ns
spec:
  type: LoadBalancer
  selector:
    app: k8s-deployment
  ports:
    - port: 8081
      targetPort: 80
---
# Ingress manifest for the k8s-ns namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-ingress
  namespace: k8s-ns
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-service
                port:
                  number: 8081
